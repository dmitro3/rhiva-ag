name: "Deploy Cloudflare"
description: "Deploy opennext project to cloudflare"
inputs: 
  watchPaths:
    required: false 
    default: "."
    description: "Folder to watch before building"
  path: 
    required: false
    default: "."
    description: "Folder to build & deploy"
  apiToken:
    required: true 
    description: "Cloudflare apiToken"
  accountId: 
    required: true
    description: "Cloudflare accountId"
  envVars:
    required: false
    description: "Environment variables for build"
runs:
  using: "composite"
  steps:
    - name: Check file changes 
      shell: bash
      id: changes
      run: |
        git fetch origin main 
        changed="false" 
        if [ -z "${{ inputs.watchPaths }}" ]; then
          changed="true" 
        else 
          paths="$(printf '%s\n%s' "${{ inputs.watchPaths }}" "${{ inputs.path }}")"
          
          while IFS= read -r path; do 
            [ -z "$path" ] && continue 
            
            if ! git diff --quiet origin/main -- "$path"; then
              changed="true"
              break
            fi
          done <<< "$paths"
        fi
        echo "This changed? $changed"
        echo "changed=$changed" >> "$GITHUB_OUTPUT"
    - uses: oven-sh/setup-bun@v1
      if: steps.changes.outputs.changed == 'true'
    - name: Build
      shell: bash
      if: steps.changes.outputs.changed == 'true'
      run: |
           cd ${{ inputs.path }} && bun install --lockfile
           bun x opennextjs-cloudflare build
      env: ${{ fromJSON(inputs.envVars) }}
    - name: Deploy
      if: steps.changes.outputs.changed == 'true'
      uses: cloudflare/wrangler-action@v3
      with:
          packageManager: bun
          wranglerVersion: "4.51.0"
          apiToken: ${{ inputs.apiToken }}
          accountId: ${{ inputs.accountId }}
          workingDirectory: ${{ inputs.path }}
