name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: false
        default: "production"
        description: "Choose an environment to deploy to: <development|staging|production>"
        options:
          - "development"
          - "staging"
          - "production"
      service:
        type: choice
        required: false
        default: "www"
        description: "Select service to deploy? <www|media|all>"
        options:
          - "www"
          - "media"
          - "all"

jobs:
  deploy_www:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' &&  (github.event.inputs.service == 'www'||github.event.inputs.service == 'all')
    name: Deploy www
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - name: Deploy www
        uses: cloudflare/wrangler-action@v3
        with:
          packageManager: bun
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: ${{ github.event.inputs.environment }}
          workingDirectory: apps/www
          command: deploy --env ${{ github.event.inputs.environment }}
          secrets: |
            NEXT_PUBLIC_BASE_URL
            NEXT_PUBLIC_MEDIA_URL
            NEXT_PUBLIC_API_URL
            NEXT_PUBLIC_TELEGRAM_LINK
            NEXT_PUBLIC_SOLANA_RPC_URL
        env:
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_MEDIA_URL: ${{ secrets.NEXT_PUBLIC_MEDIA_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_TELEGRAM_LINK: ${{ secrets.NEXT_PUBLIC_TELEGRAM_LINK }}
          NEXT_PUBLIC_SOLANA_RPC_URL: ${{ secrets.NEXT_PUBLIC_SOLANA_RPC_URL }}
          NEXT_PUBLIC_JITO_API_URL: ${{ secrets.NEXT_PUBLIC_JITO_API_URL }} 
          NEXT_PUBLIC_JITO_UUID: ${{ secrets.NEXT_PUBLIC_JITO_UUID }}
          NEXT_PUBLIC_HELIUS_API_URL: ${{ secrets.NEXT_PUBLIC_HELIUS_API_URL }}
          NEXT_PUBLIC_HELIUS_API_KEY: ${{ secrets.NEXT_PUBLIC_HELIUS_API_KEY }}
  deploy_media:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && ( github.event.inputs.service == 'media' ||  github.event.inputs.service == 'all')
    name: Deploy media
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - name: Deploy media
        uses: cloudflare/wrangler-action@v3
        with:
          packageManager: bun
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: ${{ github.event.inputs.environment }}
          workingDirectory: apps/media
          command: deploy --env ${{ github.event.inputs.environment }}
