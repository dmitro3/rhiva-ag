[package]
name = "rpcpool"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
bytes = "1.11.0"
chrono = "0.4.42"
dotenv = "0.15.0"
hyper = "1.8.1"
log = "0.4.29"
redis = { version = "1.0.1", features = ["sentinel"] }
rediserde = "0.2.0"
reqwest="0.12.26"
serde = {version="1.0.228", features=["derive"]}
serde_json = "1.0.145"
tokio = {version="1.48.0", features=["macros", "rt-multi-thread"]}
tower-http = {version="0.6.8", features=["trace"]}
tracing = {version="0.1.44"}
tracing-subscriber = {version="0.3.22", features=["fmt", "env-filter"]}
urlencoding = "2.1.3"

[dev-dependencies]
solana-client = "3.1.5"

[features]
default = []
seed = []
